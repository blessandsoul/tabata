<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TABATA" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<title>TABATA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'VT323', monospace;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 30px 20px 80px;
  }

  /* Setup form */
  .setup {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    font-size: 32px;
    letter-spacing: 3px;
    padding: 20px 0 40px;
  }

  .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .field .label {
    font-size: 28px;
    letter-spacing: 4px;
    opacity: 0.9;
  }

  .field .suffix {
    font-size: 22px;
    letter-spacing: 4px;
    opacity: 0.7;
  }

  .setup input {
    width: 220px;
    height: 64px;
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    font-family: 'VT323', monospace;
    font-size: 40px;
    text-align: center;
    padding: 0 8px;
    -moz-appearance: textfield;
  }

  .setup input::-webkit-outer-spin-button,
  .setup input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .setup input:focus { outline: none; }

  .start-row {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }

  .start-btn {
    background: #fff;
    color: #000;
    border: 2px solid #fff;
    font-family: 'VT323', monospace;
    font-size: 40px;
    letter-spacing: 4px;
    padding: 10px 60px;
    cursor: pointer;
  }

  .start-btn:hover { background: #eaeaea; }
  .start-btn:focus { outline: none; }

  /* Running view */
  .runner {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .phase {
    font-size: 64px;
    letter-spacing: 8px;
  }

  .phase.work { color: #fff; }
  .phase.rest { color: #ff3b3b; }

  .countdown {
    font-size: 280px;
    line-height: 1;
    letter-spacing: 4px;
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .countdown.pulse { transform: scale(1.08); }
  .countdown.warn { color: #ff3b3b; }

  .round-info {
    font-size: 32px;
    letter-spacing: 4px;
    opacity: 0.85;
  }

  .runner-controls {
    display: flex;
    gap: 14px;
    margin-top: 10px;
  }

  .status {
    font-size: 18px;
    letter-spacing: 2px;
    opacity: 0.55;
    margin-top: 8px;
    text-align: center;
    max-width: 340px;
    line-height: 1.3;
  }
  .status.warn { color: #ffb84d; opacity: 0.85; }

  .ctrl-btn {
    background: transparent;
    color: #fff;
    border: 2px solid #fff;
    font-family: 'VT323', monospace;
    font-size: 28px;
    letter-spacing: 3px;
    padding: 8px 28px;
    cursor: pointer;
  }
  .ctrl-btn:hover { background: #fff; color: #000; }
  .ctrl-btn:focus { outline: none; }

  /* Done */
  .done {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .done h1 {
    font-size: 96px;
    letter-spacing: 10px;
  }

  /* Show helpers */
  .show { display: flex !important; }

  @media (max-width: 640px) {
    .setup { font-size: 28px; gap: 14px 16px; }
    .setup input { width: 140px; height: 54px; font-size: 32px; }
    .start-btn { font-size: 32px; padding: 8px 40px; }
    .countdown { font-size: 180px; }
    .phase { font-size: 44px; }
  }
</style>
</head>
<body>

<main class="stage">
  <!-- Setup -->
  <form class="setup show" id="setupForm" autocomplete="off">
    <div class="field">
      <label class="label" for="rounds">FOR</label>
      <input id="rounds" type="number" min="1" max="99" value="8" />
      <span class="suffix">ROUND</span>
    </div>

    <div class="field">
      <label class="label" for="work">WORK</label>
      <input id="work" type="number" min="1" max="999" value="20" />
      <span class="suffix">SECONDS</span>
    </div>

    <div class="field">
      <label class="label" for="rest">REST</label>
      <input id="rest" type="number" min="0" max="999" value="10" />
      <span class="suffix">SECONDS</span>
    </div>

    <div class="start-row">
      <button type="submit" class="start-btn">START</button>
    </div>
  </form>

  <!-- Running -->
  <section class="runner" id="runner">
    <div class="phase work" id="phaseLabel">WORK</div>
    <div class="countdown" id="countdown">20</div>
    <div class="round-info" id="roundInfo">ROUND 1 / 8</div>
    <div class="runner-controls">
      <button class="ctrl-btn" id="pauseBtn">PAUSE</button>
      <button class="ctrl-btn" id="stopBtn">STOP</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <!-- Done -->
  <section class="done" id="done">
    <h1>DONE</h1>
    <button class="ctrl-btn" id="againBtn">AGAIN</button>
  </section>
</main>

<audio id="audioEl" playsinline preload="auto" x-webkit-airplay="deny"></audio>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const setupForm = $('setupForm');
  const runner    = $('runner');
  const doneView  = $('done');

  const roundsInput = $('rounds');
  const workInput   = $('work');
  const restInput   = $('rest');

  const phaseLabel = $('phaseLabel');
  const countdown  = $('countdown');
  const roundInfo  = $('roundInfo');

  const pauseBtn = $('pauseBtn');
  const stopBtn  = $('stopBtn');
  const againBtn = $('againBtn');

  const audioEl   = $('audioEl');
  const statusEl  = $('status');

  function setStatus(text, warn = false) {
    statusEl.textContent = text || '';
    statusEl.classList.toggle('warn', !!warn);
  }

  // ---------- Wake Lock (keeps screen from auto-locking; needs HTTPS) ----------
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {}
  }
  async function releaseWakeLock() {
    try { if (wakeLock) await wakeLock.release(); } catch {}
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state && !state.paused) {
      if (!wakeLock) requestWakeLock();
      if (audioEl.paused) audioEl.play().catch(() => {});
    }
  });

  // ---------- Plan ----------
  function buildPlan(rounds, work, rest) {
    const segments = [];
    let cursor = 0;
    for (let r = 1; r <= rounds; r++) {
      segments.push({ start: cursor, end: cursor + work, phase: 'work', round: r });
      cursor += work;
      if (rest > 0 && r < rounds) {
        segments.push({ start: cursor, end: cursor + rest, phase: 'rest', round: r });
        cursor += rest;
      }
    }
    return { segments, total: cursor };
  }

  // ---------- PCM generation: bake the entire workout into one WAV blob ----------
  const BEEP_CFG = {
    3:   { freq: 660,  dur: 0.18, gain: 0.45, type: 'square' },
    2:   { freq: 880,  dur: 0.22, gain: 0.6,  type: 'square' },
    1:   { freq: 1100, dur: 0.28, gain: 0.75, type: 'square' },
    end: { freq: 1320, dur: 0.55, gain: 0.75, type: 'saw'    },
  };

  function mixBeep(samples, sr, when, cfg) {
    const startSample = Math.floor(when * sr);
    if (startSample >= samples.length || startSample < 0) return;
    const durSamples = Math.floor(cfg.dur * sr);
    const attack = Math.floor(sr * 0.006);
    for (let i = 0; i < durSamples; i++) {
      const idx = startSample + i;
      if (idx >= samples.length) break;
      const t = i / sr;
      let s;
      if (cfg.type === 'square')      s = Math.sin(2 * Math.PI * cfg.freq * t) > 0 ? 1 : -1;
      else if (cfg.type === 'saw')    s = ((t * cfg.freq) % 1) * 2 - 1;
      else                            s = Math.sin(2 * Math.PI * cfg.freq * t);

      let env;
      if (i < attack) env = i / attack;
      else            env = Math.exp(-((i - attack) / (durSamples - attack)) * 6);

      samples[idx] += s * cfg.gain * env;
    }
  }

  function generateWorkoutWavBlob(plan) {
    const sr = 16000;
    // pad an extra 0.2s so the final end-tone has tail
    const totalSamples = Math.ceil((plan.total + 0.2) * sr);
    const samples = new Float32Array(totalSamples);

    // Continuous low-amplitude pink-ish noise floor so iOS sees the
    // playback as active media (NOT silence) the entire time.
    let last = 0;
    for (let i = 0; i < totalSamples; i++) {
      const n = (Math.random() - 0.5) * 0.012;
      last = last * 0.85 + n * 0.15;
      samples[i] = last;
    }

    for (const seg of plan.segments) {
      for (let n = 3; n >= 1; n--) {
        const at = seg.end - n;
        if (at >= 0) mixBeep(samples, sr, at, BEEP_CFG[n]);
      }
      mixBeep(samples, sr, seg.end, BEEP_CFG.end);
    }

    // Encode as 16-bit PCM WAV
    const buf = new ArrayBuffer(44 + totalSamples * 2);
    const view = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF');
    view.setUint32(4, 36 + totalSamples * 2, true);
    w(8, 'WAVE'); w(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    w(36, 'data');
    view.setUint32(40, totalSamples * 2, true);
    for (let i = 0; i < totalSamples; i++) {
      let s = samples[i];
      if (s > 1) s = 1; else if (s < -1) s = -1;
      view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  // ---------- Run state ----------
  let state = null;
  let lastDisplayedSecond = null;

  function show(view) {
    setupForm.classList.remove('show');
    runner.classList.remove('show');
    doneView.classList.remove('show');
    view.classList.add('show');
  }

  function findSegment(elapsed) {
    for (const seg of state.plan.segments) {
      if (elapsed < seg.end) return { seg, secondsLeft: Math.max(0, Math.ceil(seg.end - elapsed)) };
    }
    return null;
  }

  function renderUI() {
    if (!state) return;
    const elapsed = audioEl.currentTime;
    if (elapsed >= state.plan.total - 0.05 || audioEl.ended) {
      finish();
      return;
    }
    const cur = findSegment(elapsed);
    if (!cur) return;
    const { seg, secondsLeft } = cur;
    phaseLabel.textContent = seg.phase.toUpperCase();
    phaseLabel.classList.toggle('work', seg.phase === 'work');
    phaseLabel.classList.toggle('rest', seg.phase === 'rest');
    if (secondsLeft !== lastDisplayedSecond) {
      lastDisplayedSecond = secondsLeft;
      countdown.textContent = secondsLeft;
      countdown.classList.toggle('warn', secondsLeft <= 3 && secondsLeft > 0);
      countdown.classList.remove('pulse');
      void countdown.offsetWidth;
      if (secondsLeft <= 3 && secondsLeft > 0) countdown.classList.add('pulse');
    }
    roundInfo.textContent = `ROUND ${seg.round} / ${state.rounds}`;
  }

  async function start() {
    const rounds = Math.max(1, parseInt(roundsInput.value, 10) || 1);
    const work   = Math.max(1, parseInt(workInput.value, 10) || 1);
    const rest   = Math.max(0, parseInt(restInput.value, 10) || 0);

    const plan = buildPlan(rounds, work, rest);

    show(runner);
    phaseLabel.textContent = 'PREPARING';
    countdown.textContent = '…';
    roundInfo.textContent = `ROUND 1 / ${rounds}`;
    setStatus('BUILDING AUDIO…');

    // yield one frame so the UI updates before we crunch samples
    await new Promise(r => setTimeout(r, 0));

    const blob = generateWorkoutWavBlob(plan);
    const url = URL.createObjectURL(blob);
    audioEl.src = url;
    audioEl.loop = false;

    state = { plan, rounds, work, rest, paused: false, audioUrl: url, uiInterval: null };
    lastDisplayedSecond = null;

    try {
      await audioEl.play();
    } catch (e) {
      teardown();
      setStatus('AUDIO BLOCKED — TAP START AGAIN', true);
      show(setupForm);
      return;
    }

    requestWakeLock();
    setStatus('SCREEN MAY LOCK — AUDIO KEEPS PLAYING');

    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title:  'TABATA',
          artist: `${rounds} × ${work}s / ${rest}s`,
          album:  'Workout Timer',
        });
        navigator.mediaSession.playbackState = 'playing';
        navigator.mediaSession.setActionHandler('pause', togglePause);
        navigator.mediaSession.setActionHandler('play',  togglePause);
        navigator.mediaSession.setActionHandler('stop',  stop);
      } catch {}
    }

    pauseBtn.textContent = 'PAUSE';
    state.uiInterval = setInterval(renderUI, 200);
    renderUI();
  }

  function pause() {
    if (!state || state.paused) return;
    audioEl.pause();
    state.paused = true;
    pauseBtn.textContent = 'RESUME';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  }

  function resume() {
    if (!state || !state.paused) return;
    audioEl.play().catch(() => {});
    state.paused = false;
    pauseBtn.textContent = 'PAUSE';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  }

  function togglePause() {
    if (!state) return;
    state.paused ? resume() : pause();
  }

  function teardown() {
    if (state) {
      if (state.uiInterval) clearInterval(state.uiInterval);
      if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
    }
    state = null;
    lastDisplayedSecond = null;
    try { audioEl.pause(); } catch {}
    try { audioEl.currentTime = 0; } catch {}
    audioEl.removeAttribute('src');
    try { audioEl.load(); } catch {}
    releaseWakeLock();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = 'none';
      try {
        navigator.mediaSession.setActionHandler('pause', null);
        navigator.mediaSession.setActionHandler('play',  null);
        navigator.mediaSession.setActionHandler('stop',  null);
      } catch {}
    }
  }

  function stop() { teardown(); setStatus(''); show(setupForm); }
  function finish() { teardown(); setStatus(''); show(doneView); }

  audioEl.addEventListener('ended', finish);

  setupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    start();
  });

  pauseBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click', stop);
  againBtn.addEventListener('click', () => show(setupForm));
})();
</script>
</body>
</html>
